<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p6_Tarjeta</title>

    <style>

        body {
            background-color: white;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px;
        }

        .tarjeta {
            background-color: #ff3b2b;
            width: 700px;
            height: 350px;
            margin: 0 auto;
            padding: 35px;
            display: flex;
            flex-direction: row;
            gap: 20px;
        }

        .izquierda {
            width: 310px;
        }

        h1 {
            color: white;
            font-size: 30px;
            margin-top: 10px;
            margin-bottom: 40px;
        }

        .flores {
            margin-bottom: 35px;
        }

        .flor {
            display: inline-block;
            font-size: 75px;
            margin-right: 20px;
            line-height: 1;
        }

        .rosa {
            color: #ed78b4;
        }

        .beige {
            color: #c8b9a3;
        }

        h2 {
            color: white;
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 15px;
        }

        .datos {
            color: white;
            font-family: Georgia, serif;
            font-size: 15px;
            line-height: 1.2;
        }

        .datos p {
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .derecha {
            background-color: #ed78b4;
            width: 330px;
            height: 280px;
            margin-top: 10px;
            text-align: center;
        }

        .derecha h3 {
            color: #003d08;
            font-family: Georgia, serif;
            font-size: 65px;
            line-height: 0.85;
            margin-top: 75px;
            margin-bottom: 0;
        }

        /* RESPONSIVE DESIGN */

        @media (max-width: 768px) {

            body {
                padding: 20px;
            }

            .tarjeta {
                width: auto;
                height: auto;
                flex-direction: column;
            }

            .izquierda {
                width: 100%;
            }

            .derecha {
                width: 100%;
                height: 250px;
                margin-top: 10px;
            }

            .derecha h3 {
                margin-top: 60px;
            }

        }

    </style>
</head>

<body>

    <div class="tarjeta">

        <div class="izquierda">

            <h1>OLIVIA WILSON</h1>

            <div class="flores">
                <span class="flor rosa">✿</span>
                <span class="flor beige">✿</span>
            </div>

            <h2>CBT Therapists</h2>

            <div class="datos">
                <p>(123) 456 7890</p>
                <p>@reallygreatsite</p>
                <p>hello@reallygreatsite.com</p>
            </div>

        </div>

        <div class="derecha">
            <h3>OLI<br>VIA</h3>
        </div>

    </div>

</body>

</html>
